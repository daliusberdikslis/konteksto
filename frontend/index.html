<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konteksto — lietuviškų žodžių žaidimas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23735af2'/><text x='50' y='70' font-size='58' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>K</text></svg>">
</head>
<body>
  <div class="app">
    

    <header class="header">
      <div class="header-top">
        <div class="logo">
          <span class="logo-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><circle cx="20" cy="10" r="3.2"/><circle cx="13" cy="20" r="3.2"/><path d="M10.8 9.2l6.2.6M9.3 10.9l2.4 6M18.4 12.6l-3.6 4.6"/></svg></span>
          <h1 class="logo-text">Konteksto</h1>
        </div>
      </div>
      <p class="subtitle">Atspėk slaptą žodį pagal semantinį artimumą</p>
      <p id="game-meta" class="game-meta" aria-live="polite"></p>
    </header>

    <main class="main">
      <!-- Input Section -->
      <section class="input-section" aria-label="Žodžio įvedimas">
        <form id="guess-form" class="guess-form" autocomplete="off">
          <div class="input-row">
            <div class="input-wrapper">
              <input
                type="text"
                id="guess-input"
                class="guess-input"
                placeholder="Įvesk žodį..."
                aria-label="Įvesk savo spėjimą"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                required
              >
            </div>
            <button type="submit" id="guess-submit" class="guess-submit" aria-label="Spėti">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
          <div id="input-error" class="input-error" role="alert" aria-live="polite"></div>
        </form>
      </section>

      <!-- Results Section -->
      <section class="results-section" aria-label="Spėjimų rezultatai">
        <div id="win-banner" class="win-banner" hidden>
          <div class="win-content">
            <span class="win-icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="16"/><path d="M13.5 20.5l5 5 8-9"/></svg></span>
            <h2 class="win-title">Sveikiname!</h2>
            <p class="win-text">Atspėjai žodį per <span id="win-count">0</span> bandymų!</p>
          </div>
        </div>
        <div id="guess-list" class="guess-list" role="list" aria-label="Spėjimų sąrašas">
          <div id="empty-state" class="empty-state">
            <div class="empty-icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="17" cy="17" r="9"/><line x1="24" y1="24" x2="32" y2="32"/><path d="M13.5 17h7"/></svg></div>
            <p class="empty-text">Pradėk žaidimą įvesdamas bet kokį lietuvišką žodį</p>
            <p class="empty-hint">Kuo žodis semantiškai artimesnis slaptam žodžiui, tuo aukštesnė jo pozicija</p>
          </div>
        </div>
      </section>
      <nav class="action-bar" aria-label="Žaidimo veiksmai">
        <button type="button" id="hint-btn" class="action-btn" aria-label="Gauti užuominą">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
          <span>Užuomina</span>
        </button>
        <button type="button" id="surrender-btn" class="action-btn surrender-btn" aria-label="Pasiduoti ir atskleisti 10 artimiausių žodžių">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v7h7"/><path d="M4 11a8 8 0 1 0 2-6.4L4 7"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
          <span>Pasiduoti</span>
        </button>
        <button type="button" id="reset-game" class="action-btn" aria-label="Naujas žaidimas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          <span>Naujas žaidimas</span>
        </button>
      </nav>
    </main>

    <footer class="footer">
      <p>Sukurta naudojant <a href="https://fasttext.cc/" target="_blank" rel="noopener">fastText</a> ir <a href="https://github.com/Semantika2/Hunspell-Zodynai-ir-gramatika-v.45" target="_blank" rel="noopener">Semantika Hunspell</a></p>
    </footer>
  </div>

  <script src="app.js?v=6"></script>
</body>
</html>
