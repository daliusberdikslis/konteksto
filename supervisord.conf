[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:morph]
command=/usr/local/bin/hmorphd2 -e
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:lex]
command=java -cp . org.springframework.boot.loader.JarLauncher
directory=/opt/lex
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:app]
command=uvicorn app.main:app --host 0.0.0.0 --port 7860
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
